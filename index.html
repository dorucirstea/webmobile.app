<style data-purpose="layout-global">
    body, html {
      margin: 0;
      padding: 0;
      height: 100%;
      overflow: hidden; /* No scroll requirement */
      background-color: #e5e5e5; /* Background color behind the main card */
      display: flex;
      align-items: center;
      justify-content: center;
    }
    
    .main-card {
      width: 95vw;
      height: 90vh;
      max-width: 1440px;
      max-height: 900px;
      position: relative;
      background: linear-gradient(180deg, #f8fafd 0%, #ebf1f7 100%);
      border: 1px solid rgba(255, 255, 255, 0.5);
      box-shadow: 0 40px 100px -20px rgba(0,0,0,0.1);
      overflow: hidden;
    }
  </style>
<style data-purpose="visual-effects">
    /* Radiant Semi-Circle Sunrise Effect */
    .sunrise-container {
      position: absolute;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 100%;
      height: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      pointer-events: none;
      z-index: 0;
    }

    .sunrise-glow {
      position: absolute;
      top: 15%;
      width: 800px;
      height: 800px;
      background: radial-gradient(circle, rgba(255,138,0,0.4) 0%, rgba(255,138,0,0) 70%);
      filter: blur(60px);
      border-radius: 50%;
    }

    .sunrise-arc {
      position: absolute;
      top: 25%;
      width: 600px;
      height: 600px;
      border-radius: 50%;
      border: 1px solid rgba(255, 255, 255, 0.8);
      background: linear-gradient(180deg, rgba(255,255,255,0.4) 0%, rgba(255,255,255,0) 50%);
      mask-image: linear-gradient(to bottom, black 50%, transparent 50%);
      -webkit-mask-image: linear-gradient(to bottom, black 50%, transparent 50%);
    }

    /* Code snippet styling */
    .code-block {
      font-family: monospace;
      font-size: 0.75rem;
      color: rgba(0,0,0,0.4);
      line-height: 1.4;
      text-align: left;
    }
  </style>
